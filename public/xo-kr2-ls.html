<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legend Speak - 2단계: 카드 결제</title>
  <style>
    :root {
      --primary-color: #2b3a4a;
      --accent-color: #d4af37;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: var(--primary-color);
      color: white;
      text-align: center;
      padding: 20px 10px;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 25px;
      background: var(--card-bg);
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      flex: 1;
    }

    .progress-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .step {
      font-weight: bold;
      color: #888;
      font-size: 14px;
    }

    .step.active {
      color: var(--primary-color);
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 4px;
    }

    .order-summary {
      background-color: #f0f4f8;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 20px;
    }

    .order-summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .order-summary-row.total {
      border-top: 1px solid #ccc;
      padding-top: 8px;
      font-weight: bold;
      font-size: 16px;
      color: var(--primary-color);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
    }

    #xolvis-card-container {
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 12px;
      min-height: 120px;
      background: #fafafa;
    }

    .pay-btn {
      width: 100%;
      background-color: var(--accent-color);
      color: #000;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 15px;
    }

    .pay-btn:hover {
      background-color: #c29f2e;
    }

    #error-message {
      color: #d9534f;
      font-size: 14px;
      margin-top: 10px;
      text-align: center;
      display: none;
    }
  </style>

  <script src="https://payment.xolvis.com/js/v1/payment.js"></script>
</head>
<body>

  <header>
    <h1>Legend Speak</h1>
  </header>

  <div class="container">
    <div class="progress-bar">
      <span class="step">1단계: 고객 정보</span>
      <span class="step active">2단계: 카드 결제</span>
    </div>

    <div class="order-summary">
      <div class="order-summary-row">
        <span>상품명</span>
        <span>Legend Speak 3개월 전체 이용권</span>
      </div>
      <div class="order-summary-row total">
        <span>총 결제금액</span>
        <span>£37.95 (약 ₩66,000)</span>
      </div>
    </div>

    <form id="payment-form">
      <div class="form-group">
        <label>신용카드 정보</label>
        <div id="xolvis-card-container"></div>
      </div>

      <button type="submit" class="pay-btn" id="pay-btn">결제하기</button>
      <div id="error-message"></div>
    </form>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const payBtn = document.getElementById("pay-btn");
      const errorDiv = document.getElementById("error-message");

      const token = window.PROMO_CHECKOUT_TOKEN;
      const publicKey = window.XOLVIS_PUBLIC_INTEGRATION_KEY;

      if (!token || !publicKey) {
        errorDiv.textContent = "결제 설정을 불러올 수 없습니다.";
        errorDiv.style.display = "block";
        return;
      }

      let xolvisClient;
      try {
        xolvisClient = new Xolvis({
          publicIntegrationKey: publicKey,
          containerId: "xolvis-card-container"
        });
        await xolvisClient.init();
      } catch (err) {
        console.error("Xolvis SDK initialization error:", err);
        errorDiv.textContent = "카드 결제 모듈 초기화 실패.";
        errorDiv.style.display = "block";
        return;
      }

      document.getElementById("payment-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        payBtn.disabled = true;
        payBtn.textContent = "결제 처리 중...";
        errorDiv.style.display = "none";

        try {
          const cardTokenResult = await xolvisClient.createTransactionToken();

          if (!cardTokenResult || !cardTokenResult.token) {
            throw new Error("카드 토큰 생성 실패. 카드 정보를 확인해 주세요.");
          }

          const response = await fetch("https://www.legendspeak.net/api/create-promo-payment", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              checkoutToken: token,
              transactionToken: cardTokenResult.token,
              cardData: cardTokenResult.card || {},
              flowId: sessionStorage.getItem("flowId") || ""
            })
          });

          const data = await response.json();

          if (response.ok && data.paymentResultUrl) {
            window.location.href = data.paymentResultUrl;
          } else {
            throw new Error(data.error || "결제 승인 중 오류가 발생했습니다.");
          }

        } catch (err) {
          errorDiv.textContent = err.message || "결제에 실패했습니다.";
          errorDiv.style.display = "block";
          payBtn.disabled = false;
          payBtn.textContent = "결제하기";
        }
      });
    });
  </script>
</body>
</html>

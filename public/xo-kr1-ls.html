<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legend Speak - 1단계: 회원가입</title>
  <style>
    :root {
      --primary-color: #2b3a4a;
      --accent-color: #d4af37;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: var(--primary-color);
      color: white;
      text-align: center;
      padding: 20px 10px;
    }

    header h1 {
      font-size: 24px;
      letter-spacing: 1px;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 25px;
      background: var(--card-bg);
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      flex: 1;
    }

    .progress-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 25px;
      position: relative;
    }

    .step {
      font-weight: bold;
      color: #888;
      font-size: 14px;
    }

    .step.active {
      color: var(--primary-color);
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 4px;
    }

    .summary-box {
      background-color: #f0f4f8;
      border-left: 4px solid var(--primary-color);
      padding: 15px;
      margin-bottom: 25px;
      border-radius: 4px;
    }

    .summary-box h3 {
      font-size: 16px;
      margin-bottom: 5px;
    }

    .summary-box p {
      font-size: 14px;
      color: #666;
    }

    .price-tag {
      font-size: 20px;
      font-weight: bold;
      color: var(--primary-color);
      margin-top: 5px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: var(--primary-color);
    }

    .submit-btn {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s ease;
      margin-top: 10px;
    }

    .submit-btn:hover {
      background-color: #1d2733;
    }

    #error-message {
      color: #d9534f;
      font-size: 14px;
      margin-top: 10px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Legend Speak</h1>
  </header>

  <div class="container">
    <div class="progress-bar">
      <span class="step active">1단계: 고객 정보</span>
      <span class="step">2단계: 결제 진행</span>
    </div>

    <div class="summary-box">
      <h3>Legend Speak 3개월 전체 이용권</h3>
      <p>모든 역사적 인물과의 무제한 대화권 포함</p>
      <div class="price-tag">£37.95 (약 ₩66,000)</div>
    </div>

    <form id="step1-form">
      <div class="form-group">
        <label for="firstName">이름 (First Name)</label>
        <input type="text" id="firstName" name="firstName" required placeholder="Gildong">
      </div>

      <div class="form-group">
        <label for="lastName">성 (Last Name)</label>
        <input type="text" id="lastName" name="lastName" required placeholder="Hong">
      </div>

      <div class="form-group">
        <label for="email">이메일 주소</label>
        <input type="email" id="email" name="email" required placeholder="example@email.com">
      </div>

      <div class="form-group">
        <label for="phone">전화번호</label>
        <input type="tel" id="phone" name="phone" required placeholder="01012345678">
      </div>

      <button type="submit" class="submit-btn" id="submit-btn">다음 단계로 이동</button>
      <div id="error-message"></div>
    </form>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("step1-form");
      const submitBtn = document.getElementById("submit-btn");
      const errorDiv = document.getElementById("error-message");

      // Track Page Load Event
      const flowId = "kr-flow-" + Date.now() + "-" + Math.random().toString(36).substring(2, 9);
      sessionStorage.setItem("flowId", flowId);

      fetch("https://www.legendspeak.net/api/promo-funnel-event", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          flowId: flowId,
          eventName: "PAGE1_LOADED",
          pageUrl: window.location.href
        })
      }).catch(err => console.error("Funnel tracking error:", err));

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.textContent = "처리 중...";
        errorDiv.style.display = "none";

        const urlParams = new URLSearchParams(window.location.search);
        
        const payload = {
          plan: "3795",
          step2File: "xo-kr2-ls.html",
          sourcePage: window.location.pathname,
          firstName: document.getElementById("firstName").value,
          lastName: document.getElementById("lastName").value,
          email: document.getElementById("email").value,
          phone: document.getElementById("phone").value,
          country: "South Korea",
          ref: urlParams.get("ref") || "",
          originalQueryString: window.location.search,
          successUrl: "https://www.legendspeak.net"
        };

        try {
          const response = await fetch("https://www.legendspeak.net/api/create-promo-checkout-link", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          const data = await response.json();

          if (response.ok && data.url) {
            window.location.href = data.url;
          } else {
            throw new Error(data.error || "체크아웃 링크 생성 실패");
          }
        } catch (err) {
          errorDiv.textContent = err.message || "오류가 발생했습니다. 다시 시도해주세요.";
          errorDiv.style.display = "block";
          submitBtn.disabled = false;
          submitBtn.textContent = "다음 단계로 이동";
        }
      });
    });
  </script>
</body>
</html>
